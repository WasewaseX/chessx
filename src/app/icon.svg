<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc95f"/>
      <stop offset="1" stop-color="#6ea03e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#4e7a2e" stroke-opacity=".4" stroke-width="2"/>
  <!-- knight bust, facing right: our own mark, not the old clip-art knight -->
  <path fill="#fbfaf5" d="
    M18 52
    Q15.5 52 15.5 49.5
    L15.5 45
    Q16 34.5 20.5 27.5
    Q24.5 21.5 29.5 18
    L31 16.5
    Q31.6 11.5 34.5 7.5
    Q36.8 10.8 37 14.2
    Q36.3 15.8 37.2 16.4
    Q41.5 19 43.2 22.8
    Q47.5 25.2 50.5 26.6
    Q54 28.4 53.6 31.2
    Q53.2 33.8 49.8 34.2
    L44.5 35
    Q46 38.5 46.9 42.5
    Q48 47 48 49.5
    Q48 52 45.5 52
    Z"/>
  <!-- ear inner notch -->
  <path fill="#d8e6bd" d="M33.7 10.8 Q34.4 12.4 35 14.4 Q33.5 13 32.9 11.2 Q33.3 10.9 33.7 10.8 Z"/>
  <!-- eye, tucked under the brow -->
  <circle cx="36.9" cy="22.7" r="2" fill="#2c3520"/>
  <!-- nostril -->
  <circle cx="50.4" cy="30" r="1.1" fill="#d8e6bd"/>
  <!-- the X: ChessX signature cut into the chest -->
  <g fill="#74a844">
    <rect x="26.5" y="41" width="10" height="3" rx="1.5" transform="rotate(45 31.5 42.5)"/>
    <rect x="26.5" y="41" width="10" height="3" rx="1.5" transform="rotate(-45 31.5 42.5)"/>
  </g>
</svg>
