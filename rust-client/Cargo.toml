[package]
name = "chessx-api"
version = "0.1.0"
edition = "2021"
description = "Blocking Rust client for the ChessX public API: daily puzzle, puzzle bank windows, Stockfish evals, ECO identification and the puzzle leaderboard."
license = "MIT"
readme = "README.md"
keywords = ["chess", "chessx", "api-client", "puzzles", "stockfish"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
