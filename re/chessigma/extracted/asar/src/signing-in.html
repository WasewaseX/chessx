<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Shown while the Google sign-in leg runs in the user's real browser (see
      src/auth-handoff.js for why it cannot run in this window).

      Without this page the window would just sit on /signin doing nothing while
      a browser opened somewhere behind it, which reads as "the button is
      broken". The shell navigates away from here on its own the moment the
      browser hands the session back.

      Same rules as offline.html: zero external assets, no IPC, locked-down CSP,
      DESIGN.md tokens (#171717 charcoal, #f59e0b amber). The single inline
      script only ever assigns an http(s) href it has parsed and validated.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Chessigma — signing in</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #171717;
        color: #e5e5e5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 30rem;
      }
      .spinner {
        width: 1.75rem;
        height: 1.75rem;
        margin: 0 auto 1.25rem;
        border: 2px solid #404040;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #fafafa;
      }
      p {
        margin: 0 0 0.75rem;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #a3a3a3;
      }
      .why {
        margin: 0 0 1.75rem;
        font-size: 0.8125rem;
        color: #737373;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid #404040;
        color: #d4d4d4;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        border-color: #f59e0b;
        color: #fafafa;
      }
      a:focus-visible {
        outline: 2px solid #fbbf24;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner"></div>
      <h1>Finish signing in in your browser</h1>
      <p>We opened a browser window for you. Once you're done there, Chessigma signs you in here automatically.</p>
      <p class="why">Google only allows sign-in from a real browser window.</p>
      <a id="cancel" href="https://www.chessigma.com/signin">Cancel</a>
    </main>
    <script>
      // Point Cancel back at the origin THIS shell was launched against, so a
      // dev session is not silently moved onto production.
      (function () {
        try {
          var origin = new URLSearchParams(location.search).get('origin');
          if (!origin) return;
          var url = new URL(origin);
          if (url.protocol !== 'https:' && url.protocol !== 'http:') return;
          document.getElementById('cancel').href = url.origin + '/signin';
        } catch (e) {
          /* keep the production default */
        }
      })();
    </script>
  </body>
</html>
