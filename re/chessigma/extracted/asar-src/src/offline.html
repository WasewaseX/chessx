<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The ONLY local page in the shell, shown when the main frame fails to load
      for a network reason (see OFFLINE_ERROR_CODES in src/config.js).

      Zero external assets and no IPC. Electron grants file:// more privilege
      than a browser does, so the smallest possible surface here is a real
      security property, and the CSP below makes that structural: no preload, no
      contextBridge, no ipcRenderer, nothing loadable from the network.

      Retry is a plain anchor: clicking it navigates the window to https, which
      is governed by the shell's own allowlist. It defaults to production and is
      re-pointed by the one inline script below, which reads the `origin` query
      param main.js passes in — otherwise a `npm run dev` session that briefly
      lost its dev server would be silently moved onto production. The script
      validates the param and only ever assigns an http(s) href.

      Colours are DESIGN.md tokens: charcoal #171717 surface, amber #f59e0b accent.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Chessigma — offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #171717;
        color: #e5e5e5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 30rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #fafafa;
      }
      p {
        margin: 0 0 1.75rem;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #a3a3a3;
      }
      a {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        background: #f59e0b;
        color: #171717;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #fbbf24;
      }
      a:focus-visible {
        outline: 2px solid #fbbf24;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Chessigma needs a connection — the app runs the live site. Check your network and try again.</p>
      <a id="retry" href="https://www.chessigma.com/">Retry</a>
    </main>
    <script>
      // Re-point Retry at the origin THIS shell was launched against. Anything
      // that is not an http(s) URL is ignored and the production default stands.
      (function () {
        try {
          var origin = new URLSearchParams(location.search).get('origin');
          if (!origin) return;
          var url = new URL(origin);
          if (url.protocol !== 'https:' && url.protocol !== 'http:') return;
          document.getElementById('retry').href = url.origin + '/';
        } catch (e) {
          /* keep the production default */
        }
      })();
    </script>
  </body>
</html>
