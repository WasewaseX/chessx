<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChessX — signing in</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #312e2b; color: #e8e6e3; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { text-align: center; padding: 48px 40px; border-radius: 16px; background: #262421;
          box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .6); max-width: 360px; }
  .spinner { width: 36px; height: 36px; margin: 0 auto 18px; border-radius: 50%;
             border: 4px solid rgba(129, 182, 76, .25); border-top-color: #81b64c;
             animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p  { margin: 0; color: #a9a49c; font-size: 14px; }
</style>
</head>
<body>
<main class="card">
  <div class="spinner" role="status" aria-label="Signing you in"></div>
  <h1>Signing you in&hellip;</h1>
  <p>Your browser is handling the Google step. This window continues on its own.</p>
</main>
</body>
</html>
